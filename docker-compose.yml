services:
  db:
    image: mariadb:10.11.16
    container_name: escolar_db
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      # Crea el usuario de la app con ALL solo sobre ${DB_NAME}.*
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    ports:
      - "127.0.0.1:${DB_HOST_PORT}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Se ejecuta solo la primera vez, cuando el volumen dbdata está vacío
      - ./database/01_control_escolar.sql:/docker-entrypoint-initdb.d/01_control_escolar.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [escolar]

  web:
    build: .
    container_name: escolar_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./app:/var/www/html
    networks: [escolar]

volumes:
  dbdata:
networks:
  escolar:
